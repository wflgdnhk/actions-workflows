name: Build
on:
  workflow_call:
    inputs:
      package_auth:
        required: false
        default: GITHUB_TOKEN
        type: string
      package_owner:
        required: false
        default: ${{ github.repository_owner }}
        type: string
      package_name:
        required: false
        default: ${{ github.event.repository.name }}
        type: string
      min_versions_to_keep:
        required: false
        default: 10
        type: number
      dockerfile_path:
        required: false
        default: Dockerfile
        type: string
    secrets:
      CR_PAT:
        required: false
env:
  REGISTRY: ghcr.io
  PACKAGE_NAME: ${{ inputs.package_name }}
  IMAGE_NAME: ${{ inputs.package_owner }}/${{ inputs.package_name }}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets[inputs.package_auth] }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          file: ${{ inputs.dockerfile_path }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
      - name: Check account type
        id: check_account
        env:
          GH_TOKEN: ${{ secrets[inputs.package_auth] }}
        run: |
          account_type=$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/users/${GITHUB_REPOSITORY_OWNER}" |
              jq -r '.type')
          echo "account_type=${account_type}" >>"${GITHUB_OUTPUT}"
      - name: Delete old Package versions
        uses: snok/container-retention-policy@v3.1.0
        with:
          image-names: ${{ env.PACKAGE_NAME }}
          cut-off: 0s
          keep-n-most-recent: ${{ inputs.min_versions_to_keep }}
          account: ${{ steps.check_account.outputs.account_type == 'User' && 'user' || inputs.package_owner }}
          token: ${{ secrets[inputs.package_auth] }}
